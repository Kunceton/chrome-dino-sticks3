; Chrome Dino @ M5Stack Stick S3
; 配置依据：兄弟项目 Digital-Stylophone 在同型号设备实测验证（官方文档的 esp32-s3-devkitc-1 方案为备选）

[env:m5stack-sticks3]
platform = espressif32@~6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_cpu = 160000000L
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
lib_deps =
	m5stack/M5Unified@^0.2.12
	m5stack/M5GFX@^0.2.18

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I src
test_build_src = yes
test_filter = *
; native 只编译纯逻辑模块（硬件模块依赖 M5/Arduino 头，见 docs/CONSTRAINTS.md Floor）
build_src_filter =
    +<game_logic.cpp>
    +<obstacle.cpp>
    +<game_session.cpp>
    +<name_gen.cpp>
    +<leaderboard.cpp>
    +<native_main_stub.cpp>
